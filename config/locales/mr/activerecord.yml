# Rails' reserved activerecord i18n namespace (validation error messages).
# Written to read naturally, not as literal translations of the English
# defaults -- see prompts/phase-05-static-pages.md: "कृपया आपले नाव लिहा,
# not नाव आवश्यक आहे फील्ड."
mr:
  errors:
    messages:
      # Generic fallback for any model/attribute without a specific
      # override below -- still reads naturally combined with a humanized
      # attribute name ("नाव आवश्यक आहे"), just not as tailored as a
      # dedicated message.
      blank: "आवश्यक आहे."
      taken: "आधीच वापरले गेले आहे."
      inclusion: "अवैध पर्याय आहे."
      too_long: "खूप मोठे आहे (जास्तीत जास्त %{count} अक्षरे)."
      # ActiveRecord::RecordInvalid's own message, built from
      # errors.full_messages -- I18n.t looks this up with no default
      # available in mr (Rails ships the English string, not translated
      # equivalents), so raising it in a Marathi request context produced
      # "Translation missing" until this was added. Caught the same way
      # as taken/inclusion above: an actual raised exception, not assumed.
      record_invalid: "जतन करता आले नाही: %{errors}"
      # Photoable (app/models/concerns/photoable.rb) -- shared by every
      # photo-attaching model, so these live at the generic errors.messages
      # level rather than per-model.
      too_large: "छायाचित्राचा आकार १० MB पेक्षा जास्त आहे. कृपया लहान आकाराचे छायाचित्र अपलोड करा."
      invalid_content_type: "कृपया JPEG, PNG किंवा WebP प्रकारचे छायाचित्र अपलोड करा."
  activerecord:
    # Humanized attribute names -- used wherever Rails builds a message from
    # "#{attribute} #{error}" (errors.full_messages, and so
    # ActiveRecord::RecordInvalid#message) rather than a fully custom
    # per-attribute override below. Without this, a _mr/_en-suffixed
    # attribute like body_mr humanizes as the English "Body mr" even inside
    # an otherwise-Marathi message -- caught by actually raising a
    # RecordInvalid in the mr locale and reading its rendered message, not
    # assumed.
    attributes:
      # Unscoped (no model prefix) -- Rails falls back to this for any
      # model that doesn't define its own override, so "स्थिती" covers
      # Article#status and Volunteer#status alike without repeating it.
      status: "स्थिती"
      article:
        headline_mr: "मुख्य मथळा (मराठी)"
        body_mr: "मजकूर (मराठी)"
    errors:
      models:
        person:
          attributes:
            name_mr:
              blank: "कृपया व्यक्तीचे नाव लिहा."
        volunteer:
          attributes:
            name:
              blank: "कृपया आपले नाव लिहा."
            phone:
              blank: "कृपया आपला मोबाईल क्रमांक लिहा."
              invalid: "कृपया योग्य १० अंकी मोबाईल क्रमांक लिहा."
            email:
              invalid: "कृपया योग्य ईमेल पत्ता लिहा."
            status:
              inclusion: "कृपया योग्य स्थिती निवडा."
        contact_message:
          attributes:
            name:
              blank: "कृपया आपले नाव लिहा."
            email:
              blank: "कृपया आपला ईमेल पत्ता लिहा."
              invalid: "कृपया योग्य ईमेल पत्ता लिहा."
            message:
              blank: "कृपया आपला संदेश लिहा."
