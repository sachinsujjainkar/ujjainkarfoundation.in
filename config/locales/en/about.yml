en:
  about:
    history_heading: "History"
    history_body: "Shivcharan Ujjainkar Foundation continues a journey that began with Maharshi Valmiki Mandal. In 2009 the work took shape as Kavi Ram Kadam Foundation, and in 2016 the organisation was restructured under its present name, Shivcharan Ujjainkar Foundation."
    vision_body: "To contribute to the all-round development of society through literature, honours, and social work."
    mission_body: "To reach across society through literary conventions, awards, student felicitations, lecture series, publications, and health and social initiatives."
    founder_pending: "Founder details will be published here soon."
