test:
  service: Disk
  root: <%= Rails.root.join("tmp/storage") %>

local:
  service: Disk
  root: <%= Rails.root.join("storage") %>

# Cloudflare R2, S3-API compatible -- no extra gem, just the standard S3
# service with a custom endpoint. See docs/06-infrastructure.md, "Media
# storage -- Cloudflare R2": egress (not storage) is the cost driver for a
# public photo-heavy site, and R2 charges nothing for it.
#
# Credentials come from ENV (see .env.example) -- unset in any environment
# where they haven't been provisioned. config.active_storage.service only
# actually selects :cloudflare in production; see
# config/environments/production.rb.
#
# Verified against the real bucket (2026-08-05): upload/exist/download/
# delete round-trip via ActiveStorage::Blob.create_and_upload!, both
# through the service directly and through the full Active Storage blob
# flow -- endpoint and credentials are genuinely confirmed working, not
# just structurally plausible.
cloudflare:
  service: S3
  endpoint: https://<%= ENV["R2_ACCOUNT_ID"] %>.r2.cloudflarestorage.com
  access_key_id: <%= ENV["R2_ACCESS_KEY_ID"] %>
  secret_access_key: <%= ENV["R2_SECRET_ACCESS_KEY"] %>
  region: auto
  bucket: <%= ENV.fetch("R2_BUCKET", "ujjainkar-media") %>
  # R2 needs path-style requests, not the virtual-hosted-style S3 defaults
  # to -- see prompts/phase-06-media-pipeline.md, "Watch for."
  force_path_style: true
  # aws-sdk-s3 defaults to auto-attaching its own checksum (flexible
  # checksums, added ~3.211) on top of Active Storage's own Content-MD5 --
  # R2 (unlike real S3) rejects having both and returns "You can only
  # specify one non-default checksum at a time." Caught by actually
  # running an upload against the real bucket, not assumed. "when_required"
  # matches pre-flexible-checksum SDK behavior, which R2 is fine with.
  request_checksum_calculation: when_required
  response_checksum_validation: when_required
