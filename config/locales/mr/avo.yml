# Full translation of Avo's own UI chrome, not just our resource labels --
# see prompts/phase-07-admin-auth.md: "Do not let Avo's default English
# strings leak through. Audit every screen in mr." Keys and interpolation
# placeholders (%{...}) match lib/generators/avo/templates/locales/avo.en.yml
# in the avo gem exactly -- Avo falls back to its own en.yml for anything
# missing here, so a key typo just silently shows English instead of
# breaking, but the intent is full coverage. Phrased naturally, not as
# literal word-for-word translations -- same rule as the rest of the site's
# Marathi copy (docs/prompts/phase-05-static-pages.md).
